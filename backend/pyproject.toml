[[tool.importlinter.contracts]]
# Phase 5 M4 Guard 1 (ADR-0021) - the Redis client is an ADAPTER concern. ADR-0005 chose Redis
# behind a port precisely so producers and consumers would not bind to it, and this milestone is
# its first real consumer, which is exactly when that intent is easiest to lose: the rate-limit
# middleware is two files away from the client and "just check Redis here" is one import.
#   - application / domain -> a capability that imported redis would have chosen an infrastructure
#     backend for a decision the port exists to keep abstract (the application-layer contract
#     already forbids it; this restates the claim for domain and pins it where the others live)
#   - delivery -> the middleware sees RateLimiterPort and must not learn what answers it, or the
#     in-process/shared substitution stops being invisible to it
#   - observability / shared -> both are leaves; a Redis import in either would make a
#     cross-cutting module carry an infrastructure dependency
# gateway.config is deliberately absent: the composition root owns the pool and annotates the
# field it holds, exactly as it already does with sqlalchemy's AsyncEngine.
name = "the Redis client is an adapter concern"
type = "forbidden"
source_modules = [
