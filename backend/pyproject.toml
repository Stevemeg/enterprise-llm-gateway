[project]
name = "enterprise-llm-gateway"
version = "0.1.0"
description = "Enterprise LLM Gateway & Cost Router — backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "cryptography>=43",
    "httpx>=0.27",          # OIDC: JWKS fetch + token exchange (adapter layer only)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "mypy>=1.13",
    "ruff>=0.7",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["gateway"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["gateway"]
plugins = ["pydantic.mypy"]

[[tool.importlinter.contracts]]
name = "domain is the innermost layer (depends on nothing else)"
type = "forbidden"
source_modules = ["gateway.domain"]
forbidden_modules = [
    "gateway.application",
    "gateway.adapters",
    "gateway.delivery",
    "gateway.config",
    "gateway.observability",
]

[[tool.importlinter.contracts]]
# Ports declare contracts; they must not bind to a transport or framework. A port that imports
# httpx has already chosen an implementation, which defeats the seam (ADR-0016 Rule 1).
name = "ports declare contracts only (no transport or framework)"
type = "forbidden"
source_modules = ["gateway.application.ports"]
forbidden_modules = ["httpx", "fastapi", "starlette", "sqlalchemy", "prometheus_client"]

[[tool.importlinter.contracts]]
# Phase-4 seam adapters must reach each other only through ports, never directly: a tool adapter
# importing the MCP adapter would bypass the registry and hard-wire a capability (invariants 1-2).
name = "phase-4 seam adapters are mutually independent"
type = "independence"
modules = [
    "gateway.adapters.tools",
    "gateway.adapters.mcp",
    "gateway.adapters.pipeline",
    "gateway.adapters.agents",
]

[[tool.importlinter.contracts]]
# Guard 2 - AgentRuntime is the sole orchestrator. An agent importing the runtime could invoke
# the chain itself, producing decisions outside the single construction site (invariant 3).
name = "agents may not orchestrate (only AgentRuntime sequences agents)"
type = "forbidden"
source_modules = [
    "gateway.application.agents.planner",
    "gateway.application.agents.policy",
    "gateway.application.agents.cost",
    "gateway.application.agents.health",
    "gateway.application.agents.provider",
]
forbidden_modules = ["gateway.application.agents.runtime"]

[[tool.importlinter.contracts]]
# Guard 3 - agents depend on BaseAgent and shared scaffolding, never on each other. Direct
# coupling would let one agent's internals dictate another's, defeating the lifecycle seam.
name = "agent implementations are mutually independent"
type = "independence"
modules = [
    "gateway.application.agents.planner",
    "gateway.application.agents.policy",
    "gateway.application.agents.cost",
    "gateway.application.agents.health",
    "gateway.application.agents.provider",
]

[[tool.importlinter.contracts]]
# Guard 4 - agents communicate through protocol and domain objects only. Reaching into adapters
# would bind orchestration to a concrete implementation and break Clean Architecture inward flow.
name = "agents depend on protocols and domain only (no adapters)"
type = "forbidden"
source_modules = ["gateway.application.agents"]
forbidden_modules = ["gateway.adapters", "gateway.delivery", "gateway.config"]

[[tool.importlinter.contracts]]
# Guard A - tool consumers depend on the protocol, never on a backend. A consumer that imports a
# concrete registry has bound itself to one implementation and the seam stops being a seam.
name = "tool consumers depend on the ToolRegistry protocol only"
type = "forbidden"
source_modules = ["gateway.application.tools"]
forbidden_modules = ["gateway.adapters"]

[[tool.importlinter.contracts]]
# Guard B - registry backends are independent. One importing another would make the pair a single
# implementation wearing two names, and parity tests would silently stop comparing anything.
name = "registry implementations are mutually independent"
type = "independence"
modules = [
    "gateway.adapters.tools.in_memory_registry",
    "gateway.adapters.tools.static_manifest_registry",
]

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: exercises real I/O (DB); runs against SQLite locally and Postgres in CI",
]

[tool.importlinter]
root_package = "gateway"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "shared is a leaf (imports nothing from other layers)"
type = "forbidden"
source_modules = ["gateway.shared"]
forbidden_modules = [
    "gateway.config",
    "gateway.delivery",
    "gateway.observability",
    "gateway.adapters",
    "gateway.application",
    "gateway.domain",
]

[[tool.importlinter.contracts]]
name = "application is framework-free and inward-only"
type = "forbidden"
source_modules = ["gateway.application"]
forbidden_modules = [
    "gateway.config",
    "gateway.delivery",
    "gateway.adapters",
    "sqlalchemy",
    "fastapi",
    "starlette",
    "redis",
    "asyncpg",
]

[[tool.importlinter.contracts]]
name = "delivery must not import the composition root"
type = "forbidden"
source_modules = ["gateway.delivery"]
forbidden_modules = ["gateway.config"]

[[tool.importlinter.contracts]]
name = "observability is cross-cutting and must not depend on delivery/config"
type = "forbidden"
source_modules = ["gateway.observability"]
forbidden_modules = ["gateway.config", "gateway.delivery"]

[[tool.importlinter.contracts]]
name = "adapters must not import delivery or the composition root"
type = "forbidden"
source_modules = ["gateway.adapters"]
forbidden_modules = ["gateway.delivery", "gateway.config"]

[[tool.importlinter.contracts]]
name = "low-level crypto primitives only via shared.secrets"
type = "forbidden"
source_modules = [
    "gateway.application",
    "gateway.domain",
    "gateway.delivery",
    "gateway.config",
    "gateway.observability",
    "gateway.adapters",
]
forbidden_modules = ["secrets", "hmac", "hashlib"]
# shared.secrets is the sanctioned importer of these primitives; ignore that edge so the
# check only catches *direct* use elsewhere (not use *through* the boundary).
ignore_imports = [
    "gateway.shared.secrets -> secrets",
    "gateway.shared.secrets -> hmac",
    "gateway.shared.secrets -> hashlib",
]

[[tool.importlinter.contracts]]
name = "asymmetric crypto (jwt/cryptography) never in business logic"
type = "forbidden"
source_modules = [
    "gateway.application",
    "gateway.domain",
    "gateway.delivery",
    "gateway.observability",
]
forbidden_modules = ["jwt", "cryptography"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cryptography.*"]
ignore_missing_imports = true

[[tool.importlinter.contracts]]
# Guard D - MCP consumers depend on the protocol only. A consumer importing a concrete gateway
# has chosen a transport, which is exactly what the McpGateway seam exists to prevent
# (ADR-0016 invariant 2, Slice 4).
name = "MCP consumers depend on the McpGateway protocol only"
type = "forbidden"
source_modules = ["gateway.application.tools", "gateway.application.agents"]
forbidden_modules = ["gateway.adapters.mcp"]

[[tool.importlinter.contracts]]
# Guard E - an MCP adapter that imports a registry implementation would bind an external protocol
# to a storage backend, so swapping either would break the other (ADR-0016 invariant 2).
name = "MCP adapters never import ToolRegistry implementations"
type = "forbidden"
source_modules = ["gateway.adapters.mcp"]
forbidden_modules = ["gateway.adapters.tools"]

[[tool.importlinter.contracts]]
# Guard G - RBAC consumers depend on the PermissionResolver port only. A stage importing a
# concrete resolver has bound enforcement to one authorization source (ADR-0016 invariant 2).
name = "RBAC consumers depend on the PermissionResolver port only"
type = "forbidden"
source_modules = ["gateway.adapters.pipeline", "gateway.application"]
forbidden_modules = ["gateway.adapters.authorization"]

[[tool.importlinter.contracts]]
# Guard H - resolvers answer "what may this principal do" and nothing else. A resolver importing
# the registry, MCP or the pipeline would be making enforcement decisions it cannot explain.
name = "PermissionResolvers depend on nothing but their port"
type = "forbidden"
source_modules = ["gateway.adapters.authorization"]
forbidden_modules = [
    "gateway.adapters.tools",
    "gateway.adapters.mcp",
    "gateway.adapters.pipeline",
    "gateway.delivery",
]

[[tool.importlinter.contracts]]
# Guard J - the routing engine is application-layer orchestration. Importing any adapter would
# let it reach a provider client directly, bypassing the decision record (ADR-0016 invariant 3).
name = "the routing engine depends on application and domain only"
type = "forbidden"
source_modules = ["gateway.application.routing"]
forbidden_modules = ["gateway.adapters", "gateway.delivery", "gateway.config"]

[[tool.importlinter.contracts]]
# Guard 2 - ProviderClient implementations are mutually independent (ADR-0016 Slice 7). One
# importing the other would make the pair a single implementation wearing two names, and the
# Rule-4 proof (a second backend validates the port with no protocol change) would be comparing
# a backend against itself.
name = "provider client implementations are mutually independent"
type = "independence"
modules = [
    "gateway.adapters.providers.in_memory_client",
    "gateway.adapters.providers.fake_client",
]

[[tool.importlinter.contracts]]
# Guard B - ProviderExecutor must not depend on accounting (ADR-0016 Slice 8). Not redundant with
# "application is framework-free and inward-only": that contract only forbids application ->
# adapters/frameworks, and says nothing about one application module importing a sibling.
# Without this, nothing stops a future edit from having the executor compute cost, update a
# budget, or write a ledger entry itself - exactly the responsibility blur this slice exists to
# prevent structurally rather than by review.
name = "provider execution does not depend on accounting"
type = "forbidden"
source_modules = ["gateway.application.providers"]
forbidden_modules = ["gateway.application.accounting"]

[[tool.importlinter.contracts]]
# Guard C - BudgetLedgerPort implementations are mutually independent (ADR-0016 Slice 9). One
# importing the other would make the pair a single implementation wearing two names, and the
# Rule-4 proof (a second backend validates the port with no protocol change) would be comparing
# a backend against itself - same reasoning as Guard 2 for ProviderClient (Slice 7).
name = "budget ledger implementations are mutually independent"
type = "independence"
modules = [
    "gateway.adapters.ledger.sql_budget_ledger",
    "gateway.adapters.ledger.in_memory_budget_ledger",
]

[[tool.importlinter.contracts]]
# Slice 10 Guard 1 - ResponseCachePort implementations are mutually independent. Same reasoning
# as Guard C for BudgetLedgerPort (Slice 9): one importing the other would make the pair a single
# implementation wearing two names, and the Rule-4 proof (a second backend validates the port
# with no protocol change) would be comparing a backend against itself.
name = "response cache implementations are mutually independent"
type = "independence"
modules = [
    "gateway.adapters.cache.sql_response_cache",
    "gateway.adapters.cache.in_memory_response_cache",
]

[[tool.importlinter.contracts]]
# Slice 10 Guard 2 - cache adapters store bytes and JSON; they must never author accounting, hold
# a budget/ledger, or make an authorization decision. Same reasoning as Guard B (ProviderExecutor
# / accounting, Slice 8): without this, nothing stops a future edit from having the cache adapter
# itself decide "was this authorized" or "does this affect spend" - exactly the responsibility
# blur these seams exist to prevent structurally rather than by review.
name = "cache adapters do not depend on accounting, budget ledger, or authorization"
type = "forbidden"
source_modules = ["gateway.adapters.cache"]
forbidden_modules = [
    "gateway.application.accounting",
    "gateway.adapters.ledger",
    "gateway.application.authorization",
    "gateway.adapters.authorization",
]

[[tool.importlinter.contracts]]
# Slice 10 Guard 3 - inference coordination (cache + dedup + the reserve/execute/settle sequence)
# never touches the authorization seam. It has nothing to bypass because it has no way to reach
# the seam at all: authorization is decided upstream, in the pipeline, before anything in this
# package runs (ADR-0016 invariant 2 applied to a new capability).
name = "inference coordination does not depend on authorization"
type = "forbidden"
source_modules = ["gateway.application.execution"]
forbidden_modules = ["gateway.application.authorization", "gateway.adapters.authorization"]

[[tool.importlinter.contracts]]
# Slice 13 Guard 1 - policy consumers depend on the PolicyEnginePort only. Exactly the shape of
# Guard G for RBAC (Slice 5): a stage that imports a concrete engine has bound enforcement to one
# policy source, and the port stops being a seam - which would also make deferring OPA
# meaningless, since substituting it is the whole reason the port exists.
name = "policy consumers depend on the PolicyEnginePort only"
type = "forbidden"
source_modules = ["gateway.adapters.pipeline", "gateway.application"]
forbidden_modules = ["gateway.adapters.policy"]

[[tool.importlinter.contracts]]
# Slice 13 Guard 2 - a policy engine answers "is this request permitted" and nothing else. It must
# not become a second router, a second authorizer, or an owner of money. Each forbidden target is
# one claim the slice makes:
#   - application.routing / agents -> policy cannot route or reach AgentRuntime (Guard L also bars
#     the runtime by name; this bars the whole routing capability)
#   - application.providers        -> policy cannot invoke a provider
#   - application.accounting / ports.ledger -> policy cannot author cost or move budget
#   - application.reflection       -> a policy denial cannot trigger a retry
#   - adapters.authorization       -> policy cannot resolve permissions; RBAC owns that question
#   - application.evaluation       -> policy does not depend on Slice 12 (no consumer needs it,
#     and coupling them would collapse two capabilities meant to stay independent)
name = "policy engines decide policy only"
type = "forbidden"
source_modules = ["gateway.adapters.policy"]
forbidden_modules = [
    "gateway.application.routing",
    "gateway.application.agents",
    "gateway.application.providers",
    "gateway.application.accounting",
    "gateway.application.ports.ledger",
    "gateway.application.reflection",
    "gateway.application.evaluation",
    "gateway.adapters.authorization",
]

[[tool.importlinter.contracts]]
# Slice 12 Guard 1 - evaluation OBSERVES a completed inference and participates in nothing.
# Forbidding these directly is what makes the slice's central claims structural rather than
# reviewed, one forbidden target per claim:
#   - application.providers   -> evaluation cannot invoke a provider
#   - application.accounting  -> evaluation cannot author cost or settle spend
#   - ports.ledger            -> evaluation cannot reserve/settle/release budget
#   - application.routing.engine -> evaluation cannot route (Guard L already bars AgentRuntime)
#   - application.reflection  -> an evaluation verdict cannot trigger a retry
#   - application.authorization -> evaluation cannot make an authorization decision
# allow_indirect_imports: evaluation -> execution.inference_coordinator -> accounting/providers is
# the intended path (it must name the outcome/response types it judges). Only a direct
# reach-around is a violation, which is exactly what this contract catches. Adapters are NOT
# listed: the blanket "application is framework-free and inward-only" contract already forbids
# gateway.application -> gateway.adapters, so repeating it here would be redundant.
name = "evaluation observes only and reaches no other capability"
type = "forbidden"
source_modules = ["gateway.application.evaluation"]
forbidden_modules = [
    "gateway.application.providers",
    "gateway.application.accounting",
    "gateway.application.ports.ledger",
    "gateway.application.routing.engine",
    "gateway.application.reflection",
    "gateway.application.authorization",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# Slice 12 Guard 2 - evaluator implementations are mutually independent. Same reasoning as the
# ProviderClient (Slice 7), BudgetLedgerPort (Slice 9) and ResponseCachePort (Slice 10)
# independence contracts: one importing the other would make the pair a single implementation
# wearing two names, and the Rule-4 proof (a second implementation validates the port with no
# protocol change) would be comparing an implementation against itself. It also underwrites the
# runner's composition tests - "one evaluator's verdict cannot erase another's" is only meaningful
# if the two cannot reach each other.
name = "evaluator implementations are mutually independent"
type = "independence"
modules = [
    "gateway.application.evaluation.response_completeness",
    "gateway.application.evaluation.usage_consistency",
]

[[tool.importlinter.contracts]]
# Slice 11 Guard 1 - reflection owns retry policy and attempt orchestration, nothing else. It
# reaches every other capability exclusively through its one sanctioned collaborator,
# InferenceCoordinator. Forbidding these four *directly* is what makes the slice's central claims
# structural rather than reviewed:
#   - application.providers  -> a retry cannot bypass ProviderExecutor (and therefore cannot skip
#                               the budget gate that precedes it inside the coordinator)
#   - application.accounting -> reflection cannot author a CostRecord or move budget itself
#   - ports.ledger           -> reflection cannot reserve, settle or release directly
#   - application.routing    -> reflection cannot reroute; provider selection stays with the
#                               routing engine / AgentRuntime (Guard L already bars the runtime)
# allow_indirect_imports: reflection -> execution -> accounting/providers is the *intended* path.
# Only a direct reach-around is a violation, which is exactly what this contract catches.
name = "reflection reaches other capabilities only through its coordinator"
type = "forbidden"
source_modules = ["gateway.application.reflection"]
forbidden_modules = [
    "gateway.application.providers",
    "gateway.application.accounting",
    "gateway.application.ports.ledger",
    "gateway.application.routing.engine",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# Slice 14 Guard 2 - the request pipeline EXECUTES stages and decides nothing itself. It knows
# only the Tier-1 stage protocol; every capability reaches it as a PipelineStage or not at all.
# One forbidden target per claim the slice makes:
#   - application.authorization / ports.policy -> the runner cannot resolve a permission or
#     evaluate a policy itself. It obeys the stage that owns each question; a runner that could
#     also decide would be a second authorizer sitting above the controls it runs.
#   - application.routing / agents -> the runner cannot route or reach AgentRuntime (Guard L bars
#     the runtime by name; this bars the whole routing capability)
#   - application.providers / execution / accounting / ports.ledger -> admission cannot invoke a
#     provider, run the reserve/execute/settle sequence, author cost or move budget. Admission
#     happens strictly before any of that, and a runner that could reach it would make "denied
#     requests cause no downstream side effect" a claim rather than a structural fact.
#   - application.reflection -> a blocked request cannot be retried into admission
#   - application.evaluation -> admission does not consult post-hoc verdicts
# NOT allow_indirect_imports, unlike the reflection and evaluation contracts: those two have a
# sanctioned collaborator they must reach through, and this one has none. application.pipeline
# imports application.ports.pipeline and nothing else, so any path at all is a violation.
name = "the request pipeline executes stages and decides nothing itself"
type = "forbidden"
source_modules = ["gateway.application.pipeline"]
forbidden_modules = [
    "gateway.application.authorization",
    "gateway.application.ports.policy",
    "gateway.application.routing",
    "gateway.application.agents",
    "gateway.application.providers",
    "gateway.application.execution",
    "gateway.application.accounting",
    "gateway.application.ports.ledger",
    "gateway.application.reflection",
    "gateway.application.evaluation",
]

[[tool.importlinter.contracts]]
# Slice 15 Guard 1 - the served request path COMPOSES capabilities and owns none of them. Every
# forbidden target is one ownership claim the slice makes, and each names the component that keeps
# the question instead:
#   - application.routing.engine -> serving cannot route. Routing arrives already decided, in the
#     RoutingExecution the admission pipeline transported; a service that could call the engine
#     would be able to re-route an admitted request and produce a second explanation of it.
#   - application.agents         -> serving cannot reach AgentRuntime (Guard L bars it by name too)
#   - application.providers      -> serving cannot call a provider; only ProviderExecutor may, and
#     only from behind the budget gate inside InferenceCoordinator
#   - application.accounting / ports.ledger -> serving cannot reserve, settle, release or author
#     cost. Money stays with ReservationService and CostAccountant.
#   - application.execution      -> serving reaches the cache/reserve/execute/settle sequence ONLY
#     through ReflectiveExecutor. Importing the coordinator directly would let a request skip the
#     retry boundary while looking identical from outside.
#   - application.ports.authorization / adapters.authorization -> serving cannot resolve a
#     permission. It obeys the admission outcome; a service that could also ask would be a second
#     authorizer able to disagree with the pipeline that already ran.
# allow_indirect_imports: serving -> reflection -> execution -> accounting/providers is the
# intended path, and serving -> ports.routing -> routing.catalog is how it names the transported
# type. Only a direct reach-around is a violation - the same shape as the Slice 11 and Slice 12
# contracts, and for the same reason.
name = "the served request path composes capabilities and owns none of them"
type = "forbidden"
source_modules = ["gateway.application.serving"]
forbidden_modules = [
    "gateway.application.routing.engine",
    "gateway.application.agents",
    "gateway.application.providers",
    "gateway.application.accounting",
    "gateway.application.ports.ledger",
    "gateway.application.execution",
    "gateway.application.ports.authorization",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# Slice 17 Guard 1 - HTTP delivery TRANSLATES and reaches inference only through InferenceService.
# The route turns an HTTP request into the existing application objects and turns the result back
# into the documented error model; it acquires no business responsibility. One forbidden target per
# claim, each naming the component that keeps the question instead:
#   - application.routing / agents -> the route cannot route or reach AgentRuntime (Guard L also
#     bars the runtime by name; this bars the whole capability)
#   - application.providers        -> the route cannot call a provider; only ProviderExecutor may,
#     and only from behind the budget gate inside InferenceCoordinator
#   - application.accounting / ports.ledger -> the route cannot reserve, settle or author cost
#   - application.execution        -> the route cannot run the cache/reserve/execute/settle
#     sequence itself, bypassing admission entirely
#   - application.reflection       -> the route cannot retry outside the established boundary
#   - application.evaluation       -> the route cannot evaluate, or re-evaluate, an outcome
#   - application.pipeline         -> the route cannot build or run a second admission chain; the
#     composition root owns which controls guard a request (Slice 14/15 guard)
# NOT forbidden, deliberately: `application.authorization.requirements`. Its own docstring names
# the delivery layer as the *producer* of a permission declaration ("whoever constructs the
# StageContext - the delivery layer, from endpoint metadata"), so declaring what an endpoint
# requires is exactly this layer's job. Producing a requirement and interpreting one are different
# responsibilities, and only AuthorizationStage does the latter.
# allow_indirect_imports: delivery -> serving -> pipeline/reflection/evaluation is the intended
# path. Only a direct reach-around is a violation - the Slice 11/12/15 shape, for the same reason.
name = "HTTP delivery translates and reaches inference only through InferenceService"
type = "forbidden"
source_modules = ["gateway.delivery"]
forbidden_modules = [
    "gateway.application.routing",
    "gateway.application.agents",
    "gateway.application.providers",
    "gateway.application.accounting",
    "gateway.application.ports.ledger",
    "gateway.application.execution",
    "gateway.application.reflection",
    "gateway.application.evaluation",
    "gateway.application.pipeline",
]
allow_indirect_imports = true
